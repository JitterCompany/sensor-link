[package]
name = "sensor-link-protocol"
version = "0.1.0"
authors = ["Jitter"]
edition = "2021"
license.workspace = true

[dependencies]
heapless = {version = "0.8.0", default-features = false, features = ["serde"]}
log = "0.4.19"
serde = { version = "1", default-features = false, features = ["derive"]}
serde-json-core = {version = "0.6.0", default-features = false, features = ["heapless"]}
serde_json = {version = "1.0.96", optional = true}
chrono = { version = "0.4.26", default-features = false, features = ["serde"]}
base64 = { version = "0.21.5",  default-features = false}
strum = { version = "0.25.0", default-features = false, features = ["derive"] }
postcard = { version = "1.1.1", features = ["experimental-derive"] }
serde_with = { version = "3.11.0", default-features = false, features = ["macros"]}
libm = "0.2.15"
thiserror-no-std = "2"

[dependencies.xxhash-rust]
version = "0.8.15"
features = ["xxh3", "const_xxh3"]
optional = true

[dev-dependencies]
tokio = {version = "1", features = ["full"]}
simple_logger = "4.2.0"
# rumqttc = "0.23"
rumqttc = { git = "https://github.com/JitterCompany/rumqtt", branch = "key-encoding-fix", features = ["use-rustls"] }
# rumqttc = { path = "../rumqtt/rumqttc", features = ["use-rustls"] }
rand = "0.8.5"
assert_float_eq="1.1"


[features]
use-std = ["serde/alloc", "serde_json", "xxhash-rust"]
