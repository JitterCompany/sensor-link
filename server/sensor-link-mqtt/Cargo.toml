[package]
name = "sensor-link-mqtt"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
sensor-link-server-core.workspace = true
sensor-link-protocol = { workspace = true, features = ["use-std"] }
task-supervisor.workspace = true
anyhow.workspace = true
chrono.workspace = true
heapless.workspace = true
opentelemetry.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "rt"] }
rumqttc.workspace = true
# rumqttc does not pick a TLS provider, and rustls cannot choose when a build enables two.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing.workspace = true
