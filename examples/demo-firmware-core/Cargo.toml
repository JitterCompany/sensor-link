[package]
name = "demo-firmware-core"
version = "0.1.0"
authors = ["Jitter"]
edition = "2021"
license.workspace = true
publish = false
description = "Hardware-independent logic of the demo firmware, shared by the firmware and the mock device."

[features]
use-std = [
    "tokio",
    "critical-section",
    "demo-protocol/use-std",
    "sensor-link-firmware/use-std",
]
alloc = ["sensor-link-firmware/alloc"]
test-mono = ["sensor-link-firmware/test-mono"]

[dependencies]
biquad = "0.4.2"
crc = "3.0.1"
critical-section = { version = "1.1", features = ["std"], optional = true }
demo-protocol = { path = "../demo-protocol" }
embassy-sync = "0.4.0"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io-async = "0.6.0"
futures = { version = "0.3", default-features = false }
heapless = { version = "0.8.0", features = ["mpmc_large"] }
log = "0.4.19"
num_enum = { version = "0.7.1", default-features = false }
paste = "1"
postcard = { version = "1.1.3", default-features = false, features = ["use-crc"] }
sensor-link-firmware = { path = "../../sensor-link-firmware" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6.0", default-features = false }
static_cell = "2.0.0"
strum = { version = "0.25.0", default-features = false, features = ["derive"] }
tokio = { version = "1.24.2", default-features = false, features = ["sync", "rt", "time", "macros"], optional = true }

[dev-dependencies]
assert_float_eq = "1.1"
demo-firmware-core = { path = ".", features = ["alloc", "use-std", "test-mono"] }
simple_logger = "*"
tokio = { version = "1.24.2", default-features = false, features = ["sync", "macros", "rt", "time"] }
wavegen = "0.4"
