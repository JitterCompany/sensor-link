[package]
name = "mock-device"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
sensor-link-firmware = { path = "../sensor-link-firmware", features = [
    "use-std",
    "mqtt-log",
] }
sensor-link-protocol.workspace = true
chrono.workspace = true
futures.workspace = true
