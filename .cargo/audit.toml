# cargo-audit config, also used for factory-test/modem-test/Cargo.lock.
# Each ignore names why the advisory does not apply or what blocks the fix.
[advisories]
ignore = [
    # crypto-bigint 0.5 timing issues, via elliptic-curve/p256 0.13. The fix
    # needs p256 0.14, a breaking upgrade for downstream firmware, and yubikey
    # 0.8 pins p256 0.13 until yubikey 0.9 is released.
    "RUSTSEC-2026-0387",
    # rsa Marvin attack, via yubikey. No fixed release. The provisioning tool
    # only signs with EccP256, so no RSA key is ever used.
    "RUSTSEC-2023-0071",
    # rustls-webpki 0.102, via rumqttc 0.25. rumqttc only wraps its error type;
    # certificates are verified by rustls 0.23 with rustls-webpki 0.103.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0382",
]
