# Demo production stack: Mosquitto (mTLS + ACL), TimescaleDB, the demo-server,
# nginx serving the firmware images and Traefik in front of the HTTP side.
# Secrets (.env, demo-server/demo-server.env) and certs live on the host only.
# mqtt.demo.example is a placeholder: replace it with your own domain.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/demo.acl:/mosquitto/config/demo.acl:ro
      - ./mosquitto/certs:/mosquitto/config/certs:ro
      - ./mosquitto/data:/mosquitto/data
    networks:
      - mqtt-network
    logging: *default-logging

  # Not published on the host: only the demo-server reaches it.
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - db-network
    logging: *default-logging

  demo-server:
    # Must match the glibc of the machine the binary was built on
    image: ubuntu:24.04
    restart: unless-stopped
    env_file:
      - ./demo-server/demo-server.env
    volumes:
      - ./demo-server:/demo-server
      # Uploaded firmware images, watched by the server to create the matching
      # rows in the firmware table (see FIRMWARE_DIR in demo-server.env)
      - ./firmwares:/firmwares:ro
    command: ./demo-server/demo-server
    depends_on:
      - mosquitto
      - timescaledb
    networks:
      - mqtt-network
      - db-network
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`mqtt.demo.example`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8087"
      - "traefik.docker.network=proxy-network"
    logging: *default-logging

  # Serves the uploaded firmware images at https://mqtt.demo.example/fw/<file>.
  # Read-only view of ./firmwares, which the signed .b64 images are copied into.
  firmware-files:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./firmwares:/usr/share/nginx/html:ro
    networks:
      - proxy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.firmware.rule=Host(`mqtt.demo.example`) && PathPrefix(`/fw/`)"
      # Beat the demo-server catch-all Host router, which matches these paths too
      - "traefik.http.routers.firmware.priority=100"
      - "traefik.http.routers.firmware.entrypoints=websecure"
      - "traefik.http.routers.firmware.tls.certresolver=letsencrypt"
      - "traefik.http.routers.firmware.middlewares=firmware-strip"
      - "traefik.http.middlewares.firmware-strip.stripprefix.prefixes=/fw"
      - "traefik.http.services.firmware.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy-network"
    logging: *default-logging

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme.json:/acme.json
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - proxy-network
    logging: *default-logging

networks:
  proxy-network:
    name: proxy-network
  mqtt-network:
  db-network:

volumes:
  timescaledb-data:
