name: Rust CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
    branches: [master]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Separate embedded workspace, not reached by the root `--all`
      - name: Check formatting (modem factory test)
        working-directory: factory-test/modem-test
        run: cargo +nightly fmt --all -- --check

  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the script can find the merge-base with the base branch.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Cargo Deps
        uses: Swatinem/rust-cache@v2
      # sensor-link-provision links against system libraries (pcsc, alsa, gtk)
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libpcsclite-dev libasound2-dev libgtk-3-dev pkg-config
      - name: Clippy (changed files)
        run: ./scripts/clippy-changed.sh "origin/${{ github.base_ref || github.ref_name }}"
      - name: Run Tests
        run: cargo test --workspace --features sensor-link-firmware/test-mono

  # The modem factory test firmware is its own embedded workspace (pinned to a
  # sensor-link commit), so the root workspace jobs above never build it.
  modem-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factory-test/modem-test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: thumbv7em-none-eabihf
          components: rust-src, rustfmt, llvm-tools
      - name: Cache Cargo Deps
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: factory-test/modem-test
      - name: Check
        run: cargo check --release
