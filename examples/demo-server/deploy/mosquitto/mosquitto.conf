# Mosquitto broker configuration: mTLS only, no anonymous access.

listener 8883

# TLS: certificates from scripts/gen-dev-certs.sh (or your own CA), mounted
# into the container at /mosquitto/config/certs/.
tls_version tlsv1.2
cafile /mosquitto/config/certs/ca.pem
certfile /mosquitto/config/certs/broker.cert
keyfile /mosquitto/config/certs/broker.key

# x509-only authentication: every client must present a certificate
# signed by our CA; its CN is used as the username/client identity.
require_certificate true
use_identity_as_username true
# Force the MQTT client ID to the username (= cert CN), so a device cannot
# spoof another device's client ID and kick its session offline.
use_username_as_clientid true
allow_anonymous false

# Topic access control per identity, see demo.acl.
acl_file /mosquitto/config/demo.acl

persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 14d
autosave_interval 1800

log_dest stdout
