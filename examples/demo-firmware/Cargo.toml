# The demo firmware: an embedded workspace of its own, excluded from the host
# workspace at the repo root. It builds for thumbv7em-none-eabihf only (see
# .cargo/config.toml).
[workspace]
members = ["bsp"]
resolver = "2"

[workspace.dependencies]
# Path dependencies on purpose, unlike the pinned rev of factory-test/modem-test:
# the demo exists to show the current building blocks, so CI catches any
# library change that breaks it.
demo-firmware-core = { path = "../demo-firmware-core" }
demo-protocol = { path = "../demo-protocol" }
sensor-link-firmware = { path = "../../sensor-link-firmware" }

critical-section = "1.2.0"
cortex-m-rt = "0.7.3"
futures = { version = "0.3.31", default-features = false }
hardware = { package = "demo-firmware-bsp", path = "bsp" }
log = "0.4"
paste = "1.0.15"
rtic = { version = "2.1.3", features = ["thumbv7-backend"] }
rtic-sync = "1.3.2"
rtt-target = "0.6.2"

[profile.dev]
opt-level = 'z'
lto = "thin"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 4

# The filters run on every sample, so they get the speed the rest trades for size
[profile.release.package.demo-firmware-core]
opt-level = 3
